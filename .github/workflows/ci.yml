name: Peblo TV CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: peblo_tv_mini
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready -U postgres
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      PEBLO_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/peblo_tv_mini
      PEBLO_SEED_ON_STARTUP: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: |
          cd backend
          pip3 install --break-system-packages -r requirements.txt

      - name: Run backend tests (against Postgres service)
        run: |
          cd backend
          python3 -m pytest

      - name: Typecheck + lint CMS
        run: |
          cd cms
          npm ci
          npx tsc -b --noEmit
          npx oxlint

      - name: Typecheck + lint Viewer
        run: |
          cd viewer
          npm ci
          npx tsc -b --noEmit
          npx oxlint

  build-and-publish:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API image
        run: |
          cd backend
          docker build -t peblo-tv-mini-api:latest .

      - name: Build CMS image
        run: |
          cd cms
          docker build -t peblo-tv-mini-cms:latest .

      - name: Build Viewer image
        run: |
          cd viewer
          docker build -t peblo-tv-mini-viewer:latest .

      - name: Explain deployment
        run: |
          echo "Deploy step: push images to a container registry (e.g. GHCR or ECR)"
          echo "with an immutable tag (git SHA), then roll out on the host:"
          echo "  docker compose pull && docker compose up -d"
          echo "In production, use managed PostgreSQL and Cloudflare R2 for storage."
          echo "Secrets (PEBLO_ADMIN_PASSWORD, PEBLO_R2_*, PEBLO_POSTGRES_DSN)"
          echo "are injected from the CI/provider secrets manager at deploy time."